openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API quản lý thành viên và chấm công; chỉ chủ sở hữu được chỉnh sửa dữ liệu
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: attendance
    description: Chấm công
  - name: members
    description: Thành viên
  - name: auth
    description: Quyền truy cập
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentAccess
      tags: [auth]
      summary: Kiểm tra trạng thái đăng nhập và quyền chủ sở hữu
      responses:
        "200":
          description: Quyền hiện tại của người truy cập
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Xem danh sách thành viên
      responses:
        "200":
          description: Danh sách thành viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberRecord"
    post:
      operationId: createMember
      tags: [members]
      summary: Thêm thành viên (chỉ chủ sở hữu)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Thành viên đã được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRecord"
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Cần đăng nhập
        "403":
          description: Chỉ chủ sở hữu được phép thao tác
  /members/{id}:
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Xóa thành viên (chỉ chủ sở hữu, giữ lịch sử chấm công)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Thành viên đã được xóa; lịch sử ca làm được giữ lại
        "401":
          description: Cần đăng nhập
        "403":
          description: Chỉ chủ sở hữu được phép thao tác
        "404":
          description: Không tìm thấy thành viên
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: Xem danh sách chấm công
      parameters:
        - in: query
          name: date
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/AttendanceStatus"
        - in: query
          name: memberId
          schema:
            type: integer
      responses:
        "200":
          description: Danh sách chấm công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Bộ lọc không hợp lệ
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Tạo bản ghi chấm công (chỉ chủ sở hữu)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Bản ghi chấm công đã được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Cần đăng nhập
        "403":
          description: Chỉ chủ sở hữu được phép thao tác
  /attendance/summary:
    get:
      operationId: getAttendanceSummary
      tags: [attendance]
      summary: Thống kê chấm công theo ngày
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Số lượng bản ghi theo trạng thái
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"
        "400":
          description: Ngày không hợp lệ
  /attendance/{id}:
    patch:
      operationId: updateAttendance
      tags: [attendance]
      summary: Cập nhật bản ghi chấm công (chỉ chủ sở hữu)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceUpdate"
      responses:
        "200":
          description: Bản ghi chấm công đã được cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Cần đăng nhập
        "403":
          description: Chỉ chủ sở hữu được phép thao tác
        "404":
          description: Không tìm thấy bản ghi
    delete:
      operationId: deleteAttendance
      tags: [attendance]
      summary: Xóa bản ghi chấm công (chỉ chủ sở hữu)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Bản ghi chấm công đã được xóa
        "401":
          description: Cần đăng nhập
        "403":
          description: Chỉ chủ sở hữu được phép thao tác
        "404":
          description: Không tìm thấy bản ghi
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccessStatus:
      type: object
      properties:
        signedIn:
          type: boolean
        isOwner:
          type: boolean
        ownerConfigured:
          type: boolean
      required: [signedIn, isOwner, ownerConfigured]
    AttendanceStatus:
      type: string
      enum: [present, late, absent, leave]
    AttendanceRecord:
      type: object
      properties:
        id:
          type: integer
        memberId:
          type: ["integer", "null"]
        employeeName:
          type: string
        workDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkIn:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        checkOut:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, memberId, employeeName, workDate, checkIn, checkOut, status, note, createdAt, updatedAt]
    AttendanceInput:
      type: object
      properties:
        memberId:
          type: integer
        employeeName:
          type: string
          minLength: 1
          maxLength: 120
        workDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkIn:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        checkOut:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        note:
          type: ["string", "null"]
          maxLength: 2000
      required: [memberId, employeeName, workDate, status]
    AttendanceUpdate:
      type: object
      properties:
        memberId:
          type: ["integer", "null"]
        employeeName:
          type: string
          minLength: 1
          maxLength: 120
        workDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkIn:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        checkOut:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        note:
          type: ["string", "null"]
          maxLength: 2000
    AttendanceSummary:
      type: object
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        total:
          type: integer
        present:
          type: integer
        late:
          type: integer
        absent:
          type: integer
        leave:
          type: integer
        checkedIn:
          type: integer
        checkedOut:
          type: integer
      required: [date, total, present, late, absent, leave, checkedIn, checkedOut]
    MemberRecord:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, createdAt]
    MemberInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [name]

