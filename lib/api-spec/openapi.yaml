openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API công khai để quản lý dữ liệu nhân viên, chấm công, dịch vụ và thẻ liệu trình.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: attendance
    description: Chấm công
  - name: members
    description: Thành viên
paths:
  /history-months:
    get:
      operationId: listHistoryMonths
      responses:
        "200":
          description: Các tháng có lịch sử nhân viên
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /personal/settings:
    put:
      operationId: updatePersonalSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalSettingsInput" }
      responses:
        "200":
          description: Cài đặt riêng của tài khoản
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalSettingsInput" }
  /personal/sync:
    post:
      operationId: syncPersonalNotebook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalSyncInput" }
      responses:
        "200":
          description: Đã thay thế các ca cá nhân trong khoảng đã xác nhận
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalSyncResult" }
        "409": { description: Dữ liệu đã thay đổi; phải đối chiếu và xác nhận lại }
  /personal/notebook:
    get:
      operationId: getPersonalNotebook
      parameters:
        - { in: query, name: month, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { in: query, name: date, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Sổ riêng của tài khoản hiện tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalNotebook" }
  /personal/services:
    post:
      operationId: createPersonalService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalServiceInput" }
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalService" }
  /personal/services/{id}:
    put:
      operationId: updatePersonalService
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalServiceInput" }
      responses:
        "200":
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalService" }
    delete:
      operationId: deletePersonalService
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Đã ẩn dịch vụ; giữ lịch sử ca cũ }
  /personal/sessions:
    post:
      operationId: createPersonalSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalSessionInput" }
      responses:
        "201":
          description: Đã ghi ca riêng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalSession" }
  /personal/sessions/{id}:
    put:
      operationId: updatePersonalSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalSessionInput" }
      responses:
        "200":
          description: Đã sửa ca riêng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalSession" }
    delete:
      operationId: deletePersonalSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Đã xóa ca riêng }
  /personal/comparison:
    get:
      operationId: getPersonalComparison
      parameters:
        - { in: query, name: memberId, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: month, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { in: query, name: date, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Đối chiếu tiền công và chi tiết ca ngày/tháng; không gồm doanh thu cơ sở hay số điện thoại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalComparison" }
  /service-types:
    get:
      operationId: listServiceTypes
      tags: [massage]
      responses:
        "200":
          description: Danh sách dịch vụ
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServiceTypeRecord" } }
    post:
      operationId: createServiceType
      tags: [massage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceTypeInput" }
      responses:
        "201":
          description: Đã thêm dịch vụ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceTypeRecord" }
  /service-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateServiceType
      tags: [massage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceTypeInput" }
      responses:
        "200":
          description: Đã sửa dịch vụ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceTypeRecord" }
    delete:
      operationId: deleteServiceType
      tags: [massage]
      responses:
        "204": { description: Đã xóa dịch vụ và giữ nguyên các ca đã lưu }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [health]
      summary: Trạng thái đăng nhập và quyền chủ sở hữu
      responses:
        "200":
          description: Trạng thái xác thực hiện tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "503":
          description: Không thể xác minh tài khoản với Clerk
  /access-grants:
    get:
      operationId: listAccessGrants
      tags: [health]
      summary: Chủ sở hữu xem danh sách cấp quyền
      responses:
        "200":
          description: Danh sách quyền
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessGrant" }
    post:
      operationId: saveAccessGrant
      tags: [health]
      summary: Chủ sở hữu cấp hoặc sửa quyền theo email đã xác minh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessGrantInput" }
      responses:
        "200":
          description: Đã lưu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessGrant" }
  /access-grants/{id}:
    delete:
      operationId: deleteAccessGrant
      tags: [health]
      summary: Chủ sở hữu thu hồi toàn bộ quyền cơ sở của tài khoản
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Đã thu hồi }
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: Xem lịch hẹn của cơ sở
      responses:
        "200":
          description: Danh sách lịch hẹn, sắp xếp theo thời gian
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Tạo lịch hẹn cho khách
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "201":
          description: Đã tạo lịch hẹn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Sửa lịch hẹn
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "200":
          description: Đã cập nhật lịch hẹn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "404": { description: Không tìm thấy lịch hẹn }
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Xóa lịch hẹn
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Đã xóa lịch hẹn }
        "404": { description: Không tìm thấy lịch hẹn }
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Xem danh sách thành viên
      parameters:
        - in: query
          name: month
          description: Tháng lịch sử; bỏ trống để xem danh sách nhân viên hiện tại.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        "200":
          description: Danh sách thành viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberRecord"
    post:
      operationId: createMember
      tags: [members]
      summary: Thêm nhân viên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Thành viên đã được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRecord"
        "400":
          description: Dữ liệu không hợp lệ
  /members/{id}:
    patch:
      operationId: updateMember
      tags: [members]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Nhân viên đã cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRecord" }
        "400": { description: Dữ liệu không hợp lệ }
        "404": { description: Không tìm thấy nhân viên }
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Xóa nhân viên và giữ lịch sử chấm công
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Thành viên đã được xóa; lịch sử ca làm được giữ lại
        "404":
          description: Không tìm thấy thành viên
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: Xem danh sách chấm công
      parameters:
        - in: query
          name: date
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/AttendanceStatus"
        - in: query
          name: memberId
          schema:
            type: integer
      responses:
        "200":
          description: Danh sách chấm công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Bộ lọc không hợp lệ
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Tạo bản ghi chấm công
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Bản ghi chấm công đã được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Dữ liệu không hợp lệ
  /attendance/summary:
    get:
      operationId: getAttendanceSummary
      tags: [attendance]
      summary: Thống kê chấm công theo ngày
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Số lượng bản ghi theo trạng thái
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"
        "400":
          description: Ngày không hợp lệ
  /attendance/{id}:
    patch:
      operationId: updateAttendance
      tags: [attendance]
      summary: Cập nhật bản ghi chấm công
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceUpdate"
      responses:
        "200":
          description: Bản ghi chấm công đã được cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Dữ liệu không hợp lệ
        "404":
          description: Không tìm thấy bản ghi
    delete:
      operationId: deleteAttendance
      tags: [attendance]
      summary: Xóa bản ghi chấm công
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Bản ghi chấm công đã được xóa
        "404":
          description: Không tìm thấy bản ghi
  /treatment-cards:
    get:
      operationId: listTreatmentCards
      responses:
        "200":
          description: Thẻ và số giờ còn lại; điện thoại được che với người chỉ xem
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TreatmentCard" } }
    post:
      operationId: createTreatmentCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreatmentCardInput" }
      responses:
        "201":
          description: Thẻ đã lưu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentCard" }
        "400": { description: Dữ liệu không hợp lệ }
  /treatment-cards/{id}:
    patch:
      operationId: updateTreatmentCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreatmentCardUpdate" }
      responses:
        "200":
          description: Thẻ đã cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentCard" }
        "400": { description: Dữ liệu không hợp lệ }
        "404": { description: Không tìm thấy thẻ }
        "409": { description: Tổng giờ không thể thấp hơn số giờ đã dùng }
    delete:
      operationId: deleteTreatmentCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Đã xóa thẻ chưa có lượt sử dụng }
        "404": { description: Không tìm thấy thẻ }
        "409": { description: "Thẻ đã từng sử dụng nên không thể xóa, kể cả khi lượt dùng cũ đã được xóa" }
  /treatment-cards/{id}/hours:
    post:
      operationId: addTreatmentCardHours
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardHoursInput" }
      responses:
        "200":
          description: Cộng giờ, ghi giao dịch nạp tiền và giữ nguyên lịch sử sử dụng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentCard" }
        "400": { description: Số giờ không hợp lệ hoặc vượt giới hạn }
        "404": { description: Không tìm thấy thẻ }
  /service-sessions:
    get:
      operationId: listServiceSessions
      parameters:
        - { in: query, name: memberId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: cardId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: month, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { in: query, name: date, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Các lượt phục vụ; một lượt chỉ được tính lương một lần
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServiceSession" } }
        "400": { description: Bộ lọc không hợp lệ }
    post:
      operationId: createServiceSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceSessionInput" }
      responses:
        "201":
          description: Đã lưu lượt phục vụ, trừ giờ thẻ và cộng lương
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSession" }
        "400": { description: Dữ liệu không hợp lệ hoặc chưa đặt mức lương }
        "404": { description: Không tìm thấy thẻ hoặc nhân viên }
        "409": { description: Thẻ không đủ giờ còn lại }
  /service-sessions/{id}:
    patch:
      operationId: updateServiceSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceSessionInput" }
      responses:
        "200":
          description: Đã cập nhật lượt phục vụ và số dư, lương tương ứng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSession" }
        "400": { description: Dữ liệu không hợp lệ }
        "404": { description: Không tìm thấy }
        "409": { description: Thẻ không đủ giờ }
    delete:
      operationId: deleteServiceSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: "Đã xóa lượt, hoàn giờ thẻ và trừ lương" }
        "404": { description: Không tìm thấy lượt }
  /massage-summary:
    get:
      operationId: getMassageSummary
      parameters:
        - { in: query, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { in: query, name: date, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: "Ngày báo cáo YYYY-MM-DD, mặc định hôm nay tại Việt Nam." }
      responses:
        "200":
          description: Doanh thu cơ sở tháng/ngày và lượt khách từ các ca chấm công.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MassageSummary" }
        "400": { description: Tháng hoặc ngày không hợp lệ }
  /member-payroll:
    get:
      operationId: getMemberPayroll
      parameters:
        - { in: query, name: memberId, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        "200":
          description: Lương từ giờ phục vụ khách, không cộng chấm công cũ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPayroll" }
        "400": { description: Tháng không hợp lệ }
        "404": { description: Không tìm thấy nhân viên }
components:
  schemas:
    PersonalSettingsInput:
      type: object
      required: [useFacilityRates]
      properties:
        useFacilityRates: { type: boolean }
    PersonalSyncInput:
      type: object
      required: [memberId, month, date, scope, revision]
      properties:
        memberId: { type: integer, minimum: 1 }
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        scope: { type: string, enum: [day, month] }
        revision: { type: string, minLength: 64, maxLength: 64 }
    PersonalSyncResult:
      type: object
      required: [removed, imported]
      properties:
        removed: { type: integer }
        imported: { type: integer }
    PersonalComparisonVisit:
      type: object
      required: [id, workDate, serviceName, customerName, minutes, hourlyRate, earnings, note]
      properties:
        id: { type: integer }
        workDate: { type: string }
        serviceName: { type: string }
        customerName: { type: string }
        minutes: { type: integer }
        hourlyRate: { type: integer }
        earnings: { type: integer }
        note: { type: string }
    PersonalDiscrepancy:
      type: object
      required: [reason, personal, reference]
      properties:
        reason: { type: string }
        personal: { type: array, items: { $ref: "#/components/schemas/PersonalComparisonVisit" } }
