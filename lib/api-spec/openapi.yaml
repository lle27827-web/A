openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API công khai để quản lý dữ liệu nhân viên, chấm công, dịch vụ và thẻ liệu trình.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: attendance
    description: Chấm công
  - name: members
    description: Thành viên
paths:
  /service-types:
    get:
      operationId: listServiceTypes
      tags: [massage]
      responses:
        "200":
          description: Danh sách dịch vụ
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServiceTypeRecord" } }
    post:
      operationId: createServiceType
      tags: [massage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceTypeInput" }
      responses:
        "201":
          description: Đã thêm dịch vụ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceTypeRecord" }
  /service-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateServiceType
      tags: [massage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceTypeInput" }
      responses:
        "200":
          description: Đã sửa dịch vụ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceTypeRecord" }
    delete:
      operationId: deleteServiceType
      tags: [massage]
      responses:
        "204": { description: Đã xóa dịch vụ và giữ nguyên các ca đã lưu }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [health]
      summary: Trạng thái đăng nhập và quyền chủ sở hữu
      responses:
        "200":
          description: Trạng thái xác thực hiện tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "503":
          description: Không thể xác minh tài khoản với Clerk
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Xem danh sách thành viên
      parameters:
        - in: query
          name: month
          description: Tháng lịch sử; bỏ trống để xem danh sách nhân viên hiện tại.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        "200":
          description: Danh sách thành viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberRecord"
    post:
      operationId: createMember
      tags: [members]
      summary: Thêm nhân viên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Thành viên đã được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRecord"
        "400":
          description: Dữ liệu không hợp lệ
  /members/{id}:
    patch:
      operationId: updateMember
      tags: [members]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Nhân viên đã cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRecord" }
        "400": { description: Dữ liệu không hợp lệ }
        "404": { description: Không tìm thấy nhân viên }
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Xóa nhân viên và giữ lịch sử chấm công
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Thành viên đã được xóa; lịch sử ca làm được giữ lại
        "404":
          description: Không tìm thấy thành viên
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: Xem danh sách chấm công
      parameters:
        - in: query
          name: date
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/AttendanceStatus"
        - in: query
          name: memberId
          schema:
            type: integer
      responses:
        "200":
          description: Danh sách chấm công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Bộ lọc không hợp lệ
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Tạo bản ghi chấm công
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Bản ghi chấm công đã được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Dữ liệu không hợp lệ
  /attendance/summary:
    get:
      operationId: getAttendanceSummary
      tags: [attendance]
      summary: Thống kê chấm công theo ngày
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Số lượng bản ghi theo trạng thái
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"
        "400":
          description: Ngày không hợp lệ
  /attendance/{id}:
    patch:
      operationId: updateAttendance
      tags: [attendance]
      summary: Cập nhật bản ghi chấm công
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceUpdate"
      responses:
        "200":
          description: Bản ghi chấm công đã được cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Dữ liệu không hợp lệ
        "404":
          description: Không tìm thấy bản ghi
    delete:
      operationId: deleteAttendance
      tags: [attendance]
      summary: Xóa bản ghi chấm công
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Bản ghi chấm công đã được xóa
        "404":
          description: Không tìm thấy bản ghi
  /treatment-cards:
    get:
      operationId: listTreatmentCards
      responses:
        "200":
          description: Thẻ và số giờ còn lại; điện thoại được che với người chỉ xem
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TreatmentCard" } }
    post:
      operationId: createTreatmentCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreatmentCardInput" }
      responses:
        "201":
          description: Thẻ đã lưu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentCard" }
        "400": { description: Dữ liệu không hợp lệ }
  /treatment-cards/{id}:
    patch:
      operationId: updateTreatmentCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreatmentCardUpdate" }
      responses:
        "200":
          description: Thẻ đã cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentCard" }
        "400": { description: Dữ liệu không hợp lệ }
        "404": { description: Không tìm thấy thẻ }
        "409": { description: Tổng giờ không thể thấp hơn số giờ đã dùng }
    delete:
      operationId: deleteTreatmentCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Đã xóa thẻ chưa có lượt sử dụng }
        "404": { description: Không tìm thấy thẻ }
        "409": { description: Cần xóa các lượt sử dụng trước khi xóa thẻ }
  /treatment-cards/{id}/hours:
    post:
      operationId: addTreatmentCardHours
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardHoursInput" }
      responses:
        "200":
          description: Cộng giờ, ghi giao dịch nạp tiền và giữ nguyên lịch sử sử dụng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentCard" }
        "400": { description: Số giờ không hợp lệ hoặc vượt giới hạn }
        "404": { description: Không tìm thấy thẻ }
  /service-sessions:
    get:
      operationId: listServiceSessions
      parameters:
        - { in: query, name: memberId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: cardId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: month, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { in: query, name: date, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Các lượt phục vụ; một lượt chỉ được tính lương một lần
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServiceSession" } }
        "400": { description: Bộ lọc không hợp lệ }
    post:
      operationId: createServiceSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceSessionInput" }
      responses:
        "201":
          description: Đã lưu lượt phục vụ, trừ giờ thẻ và cộng lương
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSession" }
        "400": { description: Dữ liệu không hợp lệ hoặc chưa đặt mức lương }
        "404": { description: Không tìm thấy thẻ hoặc nhân viên }
        "409": { description: Thẻ không đủ giờ còn lại }
  /service-sessions/{id}:
    patch:
      operationId: updateServiceSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceSessionInput" }
      responses:
        "200":
          description: Đã cập nhật lượt phục vụ và số dư, lương tương ứng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSession" }
        "400": { description: Dữ liệu không hợp lệ }
        "404": { description: Không tìm thấy }
        "409": { description: Thẻ không đủ giờ }
    delete:
      operationId: deleteServiceSession
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: "Đã xóa lượt, hoàn giờ thẻ và trừ lương" }
        "404": { description: Không tìm thấy lượt }
  /massage-summary:
    get:
      operationId: getMassageSummary
      parameters:
        - { in: query, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { in: query, name: date, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: "Ngày báo cáo YYYY-MM-DD, mặc định hôm nay tại Việt Nam." }
      responses:
        "200":
          description: Doanh thu cơ sở tháng/ngày và lượt khách từ các ca chấm công.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MassageSummary" }
        "400": { description: Tháng hoặc ngày không hợp lệ }
  /member-payroll:
    get:
      operationId: getMemberPayroll
      parameters:
        - { in: query, name: memberId, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        "200":
          description: Lương từ giờ phục vụ khách, không cộng chấm công cũ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPayroll" }
        "400": { description: Tháng không hợp lệ }
        "404": { description: Không tìm thấy nhân viên }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthStatus:
      type: object
      properties:
        authConfigured:
          type: boolean
        authenticated:
          type: boolean
        isOwner:
          type: boolean
      required: [authConfigured, authenticated, isOwner]
    AttendanceStatus:
      type: string
      enum: [present, late, absent, leave]
    AttendanceRecord:
      type: object
      properties:
        id:
          type: integer
        memberId:
          type: ["integer", "null"]
        employeeName:
          type: string
        workDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkIn:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        checkOut:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, memberId, employeeName, workDate, checkIn, checkOut, status, note, createdAt, updatedAt]
    AttendanceInput:
      type: object
      properties:
        memberId:
          type: integer
        employeeName:
          type: string
          minLength: 1
          maxLength: 120
        workDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkIn:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        checkOut:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        note:
          type: ["string", "null"]
          maxLength: 2000
      required: [memberId, employeeName, workDate, status]
    AttendanceUpdate:
      type: object
      properties:
        memberId:
          type: ["integer", "null"]
        employeeName:
          type: string
          minLength: 1
          maxLength: 120
        workDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkIn:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        checkOut:
          type: ["string", "null"]
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        note:
          type: ["string", "null"]
          maxLength: 2000
    AttendanceSummary:
      type: object
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        total:
          type: integer
        present:
          type: integer
        late:
          type: integer
        absent:
          type: integer
        leave:
          type: integer
        checkedIn:
          type: integer
        checkedOut:
          type: integer
      required: [date, total, present, late, absent, leave, checkedIn, checkedOut]
    MemberRecord:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        hourlyRate: { type: integer, minimum: 0 }
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        historicalNameSource:
          type: string
          enum: [version, session, unverified]
      required: [id, name, hourlyRate, createdAt]
    MemberInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        hourlyRate: { type: integer, minimum: 0, maximum: 10000000 }
      required: [name]
    MemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        hourlyRate: { type: integer, minimum: 0, maximum: 10000000 }
    TreatmentCard:
      type: object
      required: [id, customerName, phone, serviceType, totalMinutes, usedMinutes, remainingMinutes, purchaseAmount, totalPaidAmount, topUps, purchaseDate, note, createdAt]
      properties:
        id: { type: integer }
        customerName: { type: string }
        phone: { type: string }
        serviceType: { type: string }
        totalMinutes: { type: integer }
        usedMinutes: { type: integer }
        remainingMinutes: { type: integer }
        purchaseAmount: { type: integer }
        totalPaidAmount: { type: number }
        mergedIntoExisting: { type: boolean }
        topUps:
          type: array
          items: { $ref: "#/components/schemas/CardTopUp" }
        purchaseDate: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    CardTopUp:
      type: object
      required: [id, minutes, amount, paymentDate, source, note, createdAt]
      properties:
        id: { type: integer }
        minutes: { type: integer }
        amount: { type: integer }
        paymentDate: { type: string }
        source: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    TreatmentCardInput:
      type: object
      required: [customerName, phone, serviceType, totalMinutes, purchaseAmount, purchaseDate]
      properties:
        customerName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 1, maxLength: 32 }
        serviceType: { type: string, minLength: 1, maxLength: 120 }
        totalMinutes: { type: integer, minimum: 1, maximum: 600000 }
        purchaseAmount: { type: integer, minimum: 0, maximum: 1000000000 }
        purchaseDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        note: { type: string, maxLength: 2000 }
    CardHoursInput:
      type: object
      required: [minutes, amount]
      properties:
        minutes: { type: integer, minimum: 1, maximum: 600000 }
        amount: { type: integer, minimum: 0, maximum: 1000000000 }
    TreatmentCardUpdate:
      type: object
      properties:
        customerName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 1, maxLength: 32 }
        serviceType: { type: string, minLength: 1, maxLength: 120 }
        totalMinutes: { type: integer, minimum: 1, maximum: 600000 }
        purchaseAmount: { type: integer, minimum: 0, maximum: 1000000000 }
        purchaseDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        note: { type: string, maxLength: 2000 }
    ServiceTypeRecord:
      type: object
      required: [id, name, hourlyRate, customerHourlyRate, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        customerHourlyRate: { type: integer }
        hourlyRate: { type: integer }
        createdAt: { type: string, format: date-time }
    ServiceTypeInput:
      type: object
      required: [name, hourlyRate, customerHourlyRate]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        customerHourlyRate: { type: integer, minimum: 1, maximum: 10000000 }
        hourlyRate: { type: integer, minimum: 1, maximum: 10000000 }
    ServiceSession:
      type: object
      required: [id, cardId, memberId, employeeName, customerName, serviceType, serviceTypeId, workDate, minutes, customerHourlyRate, customerCharge, hourlyRate, earnings, note, createdAt]
      properties:
        id: { type: integer }
        cardId: { type: ["integer", "null"] }
        memberId: { type: ["integer", "null"] }
        employeeName: { type: string }
        serviceTypeId: { type: ["integer", "null"] }
        customerName: { type: string }
        serviceType: { type: string }
        workDate: { type: string }
        minutes: { type: integer }
        customerHourlyRate: { type: integer }
        customerCharge: { type: integer }
        hourlyRate: { type: integer }
        earnings: { type: integer }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    ServiceSessionInput:
      type: object
      required: [memberId, workDate, minutes]
      properties:
        memberId: { type: integer, minimum: 1 }
        serviceTypeId: { type: ["integer", "null"], minimum: 1 }
        cardId: { type: ["integer", "null"], minimum: 1 }
        customerName: { type: string, maxLength: 120 }
        serviceType: { type: string, maxLength: 120 }
        workDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        note: { type: string, maxLength: 2000 }
    MassageSummary:
      type: object
      required: [month, revenue, netRevenue, serviceRevenue, walkInServiceRevenue, walkInServiceMinutes, revenueExcludingCardSessions, cardRevenue, payroll, cardsSold, walkInVisits, cardVisits, today]
      properties:
        month: { type: string }
        revenue: { type: number, description: "Tổng doanh thu gộp: tiền dịch vụ khách lẻ cộng tiền bán thẻ trong tháng; không cộng lại khi dùng thẻ." }
        netRevenue: { type: number, description: "Doanh thu khách lẻ, bán và nạp thẻ trừ tiền công mọi ca đang hoạt động; không cộng doanh thu khi dùng thẻ." }
        serviceRevenue: { type: number, description: "Tiền khách lẻ trả theo giá dịch vụ đã lưu ở từng ca; không gồm ca thanh toán bằng thẻ." }
        walkInServiceRevenue: { type: number, description: "Bí danh tương thích của serviceRevenue; không gồm ca đã dùng thẻ." }
        walkInServiceMinutes: { type: integer, description: "Tổng số phút phục vụ khách lẻ; không gồm ca đã dùng thẻ." }
        revenueExcludingCardSessions: { type: number, description: "Tổng doanh thu gộp, không tính lại dịch vụ đã thanh toán qua thẻ." }
        cardRevenue: { type: number, description: "Tiền bán thẻ theo ngày mua và tiền nạp theo ngày giao dịch." }
        payroll: { type: number, description: "Tổng tiền công nhân viên theo ca trong tháng, gồm ca khách lẻ và thẻ còn hoạt động." }
        cardsSold: { type: integer }
        walkInVisits: { type: integer, description: "Số ca không dùng thẻ; mỗi ca là một lượt khách." }
        cardVisits: { type: integer, description: "Số ca dùng các thẻ đang hoạt động." }
        today: { $ref: "#/components/schemas/DailyRevenue" }
    DailyRevenue:
