openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API cho danh sách công việc chỉ chủ sở hữu mới được chỉnh sửa
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Công việc
  - name: auth
    description: Quyền truy cập
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: Xem danh sách công việc
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - in: query
          name: priority
          schema:
            $ref: "#/components/schemas/TaskPriority"
      responses:
        "200":
          description: Danh sách công việc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Tạo công việc (chỉ chủ sở hữu)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Công việc đã được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Cần đăng nhập
        "403":
          description: Chỉ chủ sở hữu được phép thao tác
  /tasks/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Thống kê tổng quan công việc
      responses:
        "200":
          description: Số lượng công việc theo trạng thái
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Cập nhật công việc (chỉ chủ sở hữu)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Công việc đã được cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Cần đăng nhập
        "403":
          description: Chỉ chủ sở hữu được phép thao tác
        "404":
          description: Không tìm thấy công việc
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Xóa công việc (chỉ chủ sở hữu)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Công việc đã được xóa
        "401":
          description: Cần đăng nhập
        "403":
          description: Chỉ chủ sở hữu được phép thao tác
        "404":
          description: Không tìm thấy công việc
  /auth/me:
    get:
      operationId: getCurrentAccess
      tags: [auth]
      summary: Kiểm tra trạng thái đăng nhập và quyền chủ sở hữu
      responses:
        "200":
          description: Quyền hiện tại của người truy cập
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
    TaskPriority:
      type: string
      enum: [low, medium, high]
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        isExample:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - status
        - priority
        - dueDate
        - isExample
        - createdAt
        - updatedAt
    TaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 2000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
      required: [title, status, priority]
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 2000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
    TaskSummary:
      type: object
      properties:
        total:
          type: integer
        todo:
          type: integer
        inProgress:
          type: integer
        done:
          type: integer
        overdue:
          type: integer
      required: [total, todo, inProgress, done, overdue]
    AccessStatus:
      type: object
      properties:
        signedIn:
          type: boolean
        isOwner:
          type: boolean
        ownerConfigured:
          type: boolean
      required: [signedIn, isOwner, ownerConfigured]

