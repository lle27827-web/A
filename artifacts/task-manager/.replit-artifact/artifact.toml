kind = "web"
previewPath = "/"
title = "Số công"
description = "Quản lý loại hình dịch vụ massage, chấm công theo dịch vụ và số giờ, lương nhân viên và thẻ liệu trình; chỉ chủ sở hữu được chỉnh sửa."
version = "1.0.0"
id = "artifacts/task-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18810

[services.development]
run = "pnpm --filter @workspace/task-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/task-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/task-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18810"
BASE_PATH = "/"
