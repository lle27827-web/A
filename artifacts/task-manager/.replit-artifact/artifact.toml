kind = "web"
previewPath = "/"
title = "Nhân viên và chấm công"
description = "Quản lý nhân viên và lịch sử ca làm bằng tiếng Việt; dữ liệu được lưu bền vững, chỉ chủ sở hữu được chỉnh sửa và mọi người khác chỉ xem."
version = "1.0.0"
id = "artifacts/task-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18810

[services.development]
run = "pnpm --filter @workspace/task-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/task-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/task-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18810"
BASE_PATH = "/"
