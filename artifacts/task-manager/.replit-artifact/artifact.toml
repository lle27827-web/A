kind = "web"
previewPath = "/"
title = "Quản lý cơ sở massage"
description = "Quản lý nhân viên, thẻ liệu trình, lượt phục vụ, lương kỹ thuật viên và doanh thu bán thẻ; chỉ chủ sở hữu được chỉnh sửa dữ liệu."
version = "1.0.0"
id = "artifacts/task-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18810

[services.development]
run = "pnpm --filter @workspace/task-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/task-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/task-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18810"
BASE_PATH = "/"
